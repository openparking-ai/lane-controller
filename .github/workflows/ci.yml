name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .

      - name: The vehicle-id pin names a commit on vehicle-id main
        # A pin to a feature-branch commit resolves until that branch is
        # deleted and then breaks `pip install` for everyone. The comment in
        # pyproject.toml saying so was not a check; this is.
        run: bash .github/scripts/check-vehicle-id-pin.sh

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: No real personal data in the repository
        run: |
          node .github/scripts/check-no-real-data.js --self-test
          node .github/scripts/check-no-real-data.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version supported and a current one. The lane runs on
        # whatever the Jetson image ships; the tests must not quietly depend on
        # a newer interpreter than that.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'

      - name: Tests
        # No hardware, no camera, no barrier, no vision model. If this ever
        # needs any of those, a hardware seam has leaked into the lane logic.
        run: pytest -q

      - name: Offline fail-control
        # Breaks the outbox on purpose and requires the offline suite to fail.
        # An offline guarantee nobody has seen fail is not known to be one.
        run: python scripts/offline_fail_control.py

      - name: Confirmation fail-control
        # Breaks the entry confirmation on purpose -- the window, the crossing
        # direction, the promotion of an unconfirmed entry, and the
        # both-arming-loops check -- and requires the loop suite to fail each
        # time. This is also what proves the suite RUNS: a suite that had
        # quietly stopped being collected would pass intact and then fail to
        # fail under every break, and this reports that.
        run: python scripts/confirmation_fail_control.py

      - name: Lane-contract fail-control
        # Breaks each property the read contract exists to have -- the geometry
        # it publishes, the completeness of the health table, `unknown` not
        # being `ok`, the read-only sweep, the derived fallback, the cursor's
        # reset flag -- and breaks the third-party lane too, because a stub that
        # satisfies every assertion is a fixture that measures nothing. Each
        # break must turn the contract suite red.
        run: python scripts/contract_fail_control.py

      - name: Fallback-cause fail-control
        # Merges the cause back into the confidence comparison on purpose --
        # at the decision, at the client, and in the record -- and requires the
        # engine-unreachable suite to fail each time. A dead engine reported as
        # a marginal read is the defect this suite exists for, and a suite that
        # cannot go red on it is not evidence that it does not happen.
        run: python scripts/fallback_cause_fail_control.py
