[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openparking-lane-controller"
version = "0.1.0"
description = "Open Parking AI lane controller — arm, identify, decide, vend"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
# Vehicle ID is a separate system, and this lane is an ordinary client of its
# contract -- the same interface a third party uses. Only `vehicle_id.contract`
# is imported (tests/test_vehicle_id_boundary.py enforces it), and that module
# is standard-library only, so this stays a dependency-free package to install:
# no torch, no OpenCV. The engine runs in its own process, reached over HTTP.
dependencies = [
  # Pinned to a commit, not to @main. This is a contract boundary: a moving
  # target on the other side of one means the lane's behaviour can change
  # without a commit here, which is the opposite of what versioning a contract
  # is for. Bumping it is a deliberate act with its own PR.
  "openparking-vehicle-id @ git+https://github.com/openparking-ai/vehicle-id@f29f64f3270bb2fd8eedc40bcb8336d674e37916",
  # The rate engine, IN-PROCESS, for the exit's local decision: a cached
  # transient is priced on the box, off the network, from the plans the cache
  # holds -- `rate_engine.contract.run_quote`, the same one function behind
  # the platform's /v1/quote, so the number the barrier shows and the number
  # the platform would compute are one computation. Standard-library only,
  # like everything else here. Pinned the same way and for the same reason;
  # `.github/scripts/check-rate-engine-pin.sh` holds it to main.
  "openparking-rate-engine @ git+https://github.com/openparking-ai/rate-engine@e04c391beb680fd9db0b56d07f042ba29d91ad81",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
# The standalone face of the module: `lane-controller serve` publishes the
# read contract in docs/CONTRACT.md. The library stays importable and
# dependency-free; nothing here adds one.
lane-controller = "lane_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
