[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openparking-lane-controller"
version = "0.1.0"
description = "Open Parking AI lane controller — arm, identify, decide, vend"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
# Vehicle ID is a separate system, and this lane is an ordinary client of its
# contract -- the same interface a third party uses. Only `vehicle_id.contract`
# is imported (tests/test_vehicle_id_boundary.py enforces it), and that module
# is standard-library only, so this stays a dependency-free package to install:
# no torch, no OpenCV. The engine runs in its own process, reached over HTTP.
dependencies = [
  # Pinned to a commit, not to @main. This is a contract boundary: a moving
  # target on the other side of one means the lane's behaviour can change
  # without a commit here, which is the opposite of what versioning a contract
  # is for. Bumping it is a deliberate act with its own PR.
  #
  # TEMPORARY, AND CI IS RED UNTIL IT IS FIXED. This commit is on vehicle-id's
  # feat/presence-gate branch, not on its main, because it is what adds the
  # `presence` field this package now reads. A pin to a branch commit survives
  # only as long as nobody deletes the branch, and `pip install` of this package
  # breaks the moment somebody does.
  #
  # `.github/scripts/check-vehicle-id-pin.sh` fails the build while this is the
  # case, so the merge order is enforced rather than remembered:
  #   1. merge vehicle-id's pull request
  #   2. re-pin the line below to the resulting commit on vehicle-id main
  #   3. merge this one
  "openparking-vehicle-id @ git+https://github.com/openparking-ai/vehicle-id@771dd13c9cfa40ce50147cd42415bc0a063fda05",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
