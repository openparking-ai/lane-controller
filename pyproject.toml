[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openparking-lane-controller"
version = "0.1.0"
description = "Open Parking AI lane controller — arm, identify, decide, vend"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
# Vehicle ID is a separate system, and this lane is an ordinary client of its
# contract -- the same interface a third party uses. The contract is the record
# shape only, standard-library only, and this package carries its own copy as
# `lane_controller.vehicle_id_contract`; nothing from the `vehicle_id` package
# is imported (tests/test_vehicle_id_boundary.py enforces it). So this stays a
# dependency-free package to install: no torch, no OpenCV. The engine runs in
# its own process, reached over HTTP.
dependencies = [
  # The rate engine, IN-PROCESS, for the exit's local decision: a cached
  # transient is priced on the box, off the network, from the plans the cache
  # holds -- `rate_engine.contract.run_quote`, the same one function behind
  # the platform's /v1/quote, so the number the barrier shows and the number
  # the platform would compute are one computation. Standard-library only,
  # like everything else here. Pinned to a commit, not to @main: this is a
  # contract boundary, and a moving target on the other side of one means the
  # lane's behaviour can change without a commit here. Bumping it is a
  # deliberate act with its own PR; `.github/scripts/check-rate-engine-pin.sh`
  # holds it to main.
  "openparking-rate-engine @ git+https://github.com/openparking-ai/rate-engine@a4d4324c0c7e71e2fbe6fd66c15e4e1254f59329",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
# The standalone face of the module: `lane-controller serve` publishes the
# read contract in docs/CONTRACT.md. The library stays importable and
# dependency-free; nothing here adds one.
lane-controller = "lane_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
