[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openparking-lane-controller"
version = "0.1.0"
description = "Open Parking AI lane controller — arm, identify, decide, vend"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Vision is deliberately NOT part of dev. The core lane package stays
# dependency-free so the simulated lane and its tests run on any machine with
# no torch and no OpenCV; only the Vehicle ID engine needs these.
#   torch      BSD-3-Clause
#   opencv     Apache-2.0
#   rapidocr   Apache-2.0, and its PP-OCRv3 weights ship under it
vision = ["torch>=2.4", "opencv-python-headless>=4.9", "numpy>=1.26", "rapidocr-onnxruntime>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
